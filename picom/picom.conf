# =============================================================================
# MODO "SNAPPY PURA" (Cero Física, Cero Tirones)
# =============================================================================

backend = "xrender";
# IMPORTANTE: Si con true da tirones, cambia a false. 
# A veces el driver de Intel prefiere manejar el vsync por su cuenta.
vsync = false; 

use-damage = true;
glx-no-rebind-pixmap = true;
unredir-if-possible = true;

# --- Estética ---
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
blur = false;
shadow = false;

# --- ANIMACIONES (MODO TRASLACIÓN PURA) ---
animations = true;
# Al subir stiffness y bajar dampening, eliminamos la "física" que causa el lag
# Esto hace que la animación sea lineal y directa.
animation-stiffness = 600.0;
animation-dampening = 25.0;
animation-window-mass = 0.5;
animation-clamping = true;
animation-delta = 5;

# 'slide-up' es el movimiento más ligero que existe en X11
animation-for-open-window = "zoom";
animation-for-unmap-window = "slide-up";
animation-for-transient-window = "slide-up";

# --- ANIMACIONES DE ESPACIO DE TRABAJO (El toque PRO) ---
# Usamos slide para que se vea como macOS o GNOME
animation-for-workspace-switch-in = "slide-left";
animation-for-workspace-switch-out = "slide-left";

# --- Optimización de FPS ---
# xrender-sync-fence causaba problemas en algunos kernels, lo quitamos.
# glx-swap-method = 1 forzamos la actualización inmediata.
glx-swap-method = 1;

# --- Wintypes (Limpieza) ---
wintypes:
{
  normal = { fade = false; shadow = false; };
  tooltip = { fade = false; shadow = false; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
};
